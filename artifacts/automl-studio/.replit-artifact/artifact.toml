kind = "web"
previewPath = "/"
title = "AutoML Studio"
version = "1.0.0"
id = "artifacts/automl-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18700

[services.development]
run = "pnpm --filter @workspace/automl-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/automl-studio", "run", "build" ]
publicDir = "artifacts/automl-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18700"
BASE_PATH = "/"
